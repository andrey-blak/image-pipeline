name: Build executables

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-22.04
            artifact: imgpipe-linux
            binary: dist/onefile/imgpipe
          - os: windows-latest
            artifact: imgpipe-windows
            binary: dist/onefile/imgpipe.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.4'

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - run: uv sync --group build

      - run: uv run pytest

      - run: uv run python packaging/build.py onefile

      - name: Smoke-test the executable
        shell: bash
        run: IMGPIPE_BIN="$PWD/${{ matrix.binary }}" uv run pytest tests/test_frozen.py -v

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Rename and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv artifacts/imgpipe-linux/imgpipe imgpipe-linux
          mv artifacts/imgpipe-windows/imgpipe.exe imgpipe-windows.exe
          chmod +x imgpipe-linux
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes imgpipe-linux imgpipe-windows.exe preset.toml
