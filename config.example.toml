# Global options.
[options]
# Make photos upright according to their EXIF orientation tag (default: true).
fix_orientation = true

# Output options. Control how the results are written.
[output]
# format - keep the original format by default; or png, jpg, webp, avif, gif, tiff, bmp
format = "keep"

# quality: 1-100, for jpg, webp and avif (default 90)
quality = 90

# opaque color for transparency where the format has none (jpg, gif, bmp)
background = "white"

# keep metadata: false - EXIF/XMP/comments are dropped; the ICC color profile always staysl true - keep all metadata
keep_metadata = false

# New file names built from a pattern. Also a table that may be placed anywhere in the file.
# Without it the files keep their names. The extension is added automatically.
[rename]
pattern = "N YYYY-MM-dd HHmmssSSS-CCC-RRaaAALLBB"
#     N - name, E - original extension, Y - year, M - month, d - day,
#     H - hour (0-23), h - hour (1-12), m - minute, s - second, S - fraction of a second (S, SS, SSS), C - counter,
#     R - random digits, A - random uppercase letter, a - random lowercase letter, L - random letter, B - random digit or letter.
#     U UUID.
#     Repeat a letter to set the width;
#     Other characters are copied as they are.
#     Put literal text containing token letters in single quotes: "'IMG'"

# The first value of the counter `C`
counter_start = 1

# Cut off solid-color or transparent margins.
[[steps]]
name = "trim_borders"

# background. default - "auto": the four corners must be the same color (within the tolerance), otherwise nothing is cut.
# Or "transparent", a color name, or "#rrggbb".
background = "auto"

# tolerance. 0-255, default - 0: how far colors may differ and still be considered "the same":
# corners from each other (auto)
# or border pixels from the background.
# 0 - exact.
# Photos and scans usually need approximately 5-10.
tolerance = 5

# Rotate by a random angle.
[[steps]]
name = "rnd_rotate"
# the rotation angle is min_angle..max_angle degrees (absolute values),
# clockwise or counterclockwise at random. Default 0..5
min_angle = 0
max_angle = 5

# crop, default: cut away the empty corners. Or "fill": keep everything on a
# larger canvas and fill the corners with the `fill` color
corners = "crop"
# For corners = "fill" only; default "transparent".
# fill = "white"

# Rotate by a fixed angle (positive - clockwise):
[[steps]]
name = "rotate"
angle = 90

# Scale keeping proportions.
[[steps]]
name = "resize"
# default mode "longest_side": the longer side becomes `size` pixels
mode = "longest_side"
size = 300

# upscale - if true: also upscale images smaller than the target
upscale = false

# Adjust brightness automatically.
[[steps]]
name = "auto_brightness"
# "autocontrast" - default mode: stretch the darkest..lightest levels to 0..255, keeping colors
method = "autocontrast"
# For autocontrast only: percent of darkest/lightest pixels to ignore
# cutoff = 0.5

# Change saturation by a random percent in the range.
[[steps]]
name = "rnd_saturation"
min_percent = 3
max_percent = 5
