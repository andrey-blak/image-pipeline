# Example pipeline config. Steps run top to bottom, in the order written.
# Run: uv run python -m imgpipe --config config.example.toml

# Global options. This table may be placed anywhere in the file, e.g. after the steps.
[options]
# Make photos upright according to their EXIF orientation tag (default: true).
# fix_orientation = true

# How the results are written. Also a table that may be placed anywhere in the file.
# Applied after the last step; it is not a step.
[output]
# format = "keep"          # keep the original format; or png, jpg, webp, avif, gif, tiff, bmp
# quality = 90             # 1-100, for jpg, webp and avif (default 90)
# background = "white"     # opaque color for transparency where the format has none (jpg, gif, bmp)
# keep_metadata = false    # false: EXIF/XMP/comments are dropped; the ICC color profile always stays

# Cut off solid-color or transparent margins (put it before `resize`).
[[steps]]
name = "trim_borders"
background = "auto"   # default: the four corners must be the same color (within the tolerance), otherwise nothing is cut.
                      # Or "transparent", a color name, or "#rrggbb".
tolerance = 5         # 0-255, default - 0: how far colors may differ and still be "the same":
                      # corners from each other (auto) or border pixels from the background.
                      # 0 = exact. Photos and scans usually need approximately 5-10.

# Scale keeping proportions: the longer side becomes `size` pixels.
[[steps]]
name = "resize"
size = 300
# mode = "longest_side"   # default
# upscale = false         # true: also enlarge images smaller than the target

# Other modes (replace the lines above):
#   Fit inside an exact size, fill the rest (`size = 300` alone means 300x300):
#     mode = "padding"
#     width = 300
#     height = 200
#     fill = "white"        # default "transparent"; "#rrggbb" also works
#   Cover an exact size, cut off the overflow evenly (center-crop):
#     mode = "crop"
#     width = 300
#     height = 200

# Adjust brightness automatically (best after `resize`).
[[steps]]
name = "auto_brightness"
# method = "autocontrast"   # default: stretch the darkest..lightest levels to 0..255, keeping colors
# cutoff = 0.5              # autocontrast only: percent of darkest/lightest pixels to ignore
#
# Or scale toward an average brightness instead (replace the lines above):
#   method = "target_mean"
#   target = 128            # wanted average brightness, 0-255
#   max_change = 0.3        # the factor is limited to 1 +/- this

# Change saturation by a random percent in this range, drawn per image.
[[steps]]
name = "rnd_saturation"
min_percent = 3
max_percent = 5
